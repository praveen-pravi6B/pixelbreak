name: Security Audit

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --trust-lockfile --allow-build esbuild

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
